<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Categories — Abdullah Store Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-layout" id="adminLayout">
  <main class="admin-main">
    <div class="admin-content">
      <div class="filter-row">
        <div style="flex:1"></div>
        <button class="btn btn-primary" id="addBtn">+ Add Category</button>
      </div>

      <div class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>Image</th><th>Name</th><th>Order</th><th>Actions</th></tr>
            </thead>
            <tbody id="categoriesBody">
              <tr><td colspan="4" class="admin-empty">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="categoryModal" style="display:none">
  <div class="modal">
    <div class="modal-title">
      <span id="modalTitle">Add Category</span>
      <button id="modalClose" style="color:var(--muted);font-size:1.2rem">✕</button>
    </div>
    <form id="categoryForm">
      <input type="hidden" id="categoryId">
      <div class="form-group">
        <label class="form-label">Name *</label>
        <input class="form-input" id="cName" required>
      </div>
      <div class="form-group">
        <label class="form-label">Image URL</label>
        <input class="form-input" id="cImage" placeholder="https://...">
      </div>
      <div class="form-group">
        <label class="form-label">Order</label>
        <input class="form-input" id="cOrder" type="number" value="0">
        <div class="form-hint">Lower numbers appear first</div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/categories.js"></script>
</body>
</html>
