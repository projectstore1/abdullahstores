<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Products — Abdullah Store Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-layout" id="adminLayout">
  <main class="admin-main">
    <div class="admin-content">
      <div class="filter-row">
        <input type="search" id="searchInput" placeholder="Search products...">
        <select id="categoryFilter"><option value="">All categories</option></select>
        <button class="btn btn-primary" id="addBtn">+ Add Product</button>
      </div>

      <div class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>Image</th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="productsBody">
              <tr><td colspan="6" class="admin-empty">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="productModal" style="display:none">
  <div class="modal">
    <div class="modal-title">
      <span id="modalTitle">Add Product</span>
      <button id="modalClose" style="color:var(--muted);font-size:1.2rem">✕</button>
    </div>
    <form id="productForm">
      <input type="hidden" id="productId">
      <div class="form-group">
        <label class="form-label">Name *</label>
        <input class="form-input" id="pName" required>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="pDesc"></textarea>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Price (USD) *</label>
          <input class="form-input" id="pPrice" type="number" step="0.01" min="0" required>
          <div class="form-hint">Naira shown on storefront</div>
        </div>
        <div class="form-group">
          <label class="form-label">Discount (%)</label>
          <input class="form-input" id="pDiscount" type="number" min="0" max="100" value="0">
        </div>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Stock *</label>
          <input class="form-input" id="pStock" type="number" min="0" required value="0">
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="pCategory"><option value="">— None —</option></select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Images (comma-separated URLs)</label>
        <input class="form-input" id="pImages" placeholder="https://..., https://...">
        <div class="form-hint">Upload image URLs directly, or use Firebase Storage URLs</div>
      </div>
      <div class="form-group">
        <label class="form-label">Upload Image</label>
        <input type="file" id="pImageFile" accept="image/*">
        <div id="uploadStatus" style="font-size:.8rem;color:var(--muted);margin-top:4px"></div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="pEnabled" checked> Enabled (visible in store)
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/products.js"></script>
</body>
</html>
