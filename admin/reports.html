<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports — Abdullah Store Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-layout" id="adminLayout">
  <main class="admin-main">
    <div class="admin-content">
      <div class="filter-row">
        <select id="rangeSelect">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="365">Last year</option>
        </select>
        <button class="btn btn-ghost" id="exportBtn">Export CSV</button>
      </div>

      <div class="stat-grid">
        <div class="stat-card" style="grid-column:span 2">
          <div class="stat-card-label">Revenue</div>
          <div class="stat-card-value" id="revenueVal">$0.00<small id="revenueNgn">₦0</small></div>
        </div>
        <div class="stat-card" style="grid-column:span 2">
          <div class="stat-card-label">Orders</div>
          <div class="stat-card-value" id="ordersVal">0</div>
        </div>
      </div>

      <div class="admin-card">
        <h3>Best Selling Products</h3>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Product</th><th>Units Sold</th><th>Revenue</th></tr></thead>
            <tbody id="bestSellersBody"><tr><td colspan="3" class="admin-empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="admin-card">
        <h3>Daily Sales</h3>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Date</th><th>Orders</th><th>Revenue</th></tr></thead>
            <tbody id="dailyBody"><tr><td colspan="3" class="admin-empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/reports.js"></script>
</body>
</html>
