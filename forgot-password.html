<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forgot Password — Abdullah Store</title>
<meta name="theme-color" content="#16A34A">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body data-page="forgot-password">

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Abdullah<span>Store</span></a>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card scale-in">
    <h1>Reset password</h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" required autocomplete="email">
        <div class="form-error" data-error="email"></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Send Reset Link</button>
    </form>

    <div class="auth-alt">
      <a href="login.html">← Back to login</a>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script type="module">
  import { resetPassword, friendlyAuthError } from "./auth.js";
  import { toast } from "./utilities.js";
  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const errEl = document.querySelector('[data-error="email"]');
    errEl.classList.remove("show");
    if (!email) { errEl.textContent = "Email is required"; errEl.classList.add("show"); return; }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = "Sending...";
    try {
      await resetPassword(email);
      toast("Check your email for the reset link", { type: "success" });
      btn.textContent = "Link sent";
    } catch (err) {
      toast(friendlyAuthError(err), { type: "error" });
      btn.disabled = false; btn.textContent = "Send Reset Link";
    }
  });
</script>
</body>
</html>
