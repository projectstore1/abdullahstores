<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Login — Abdullah Store</title>
<meta name="theme-color" content="#16A34A">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body data-page="login">

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Abdullah<span>Store</span></a>
    <div class="header-actions" style="margin-left:auto">
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 12h11L21 8H6"/></svg>
        <span class="cart-badge" data-cart-badge style="display:none">0</span>
      </a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card scale-in">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue shopping.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" required autocomplete="email">
        <div class="form-error" data-error="email"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" required autocomplete="current-password">
        <div class="form-error" data-error="password"></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Login</button>
    </form>

    <div style="text-align:right;margin-top:8px;font-size:.85rem">
      <a href="forgot-password.html" style="color:var(--green)">Forgot password?</a>
    </div>

    <div class="auth-sep">or</div>

    <button class="btn btn-google btn-block" id="googleBtn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" style="margin-right:8px">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-alt">
      No account? <a href="register.html">Create one</a>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
