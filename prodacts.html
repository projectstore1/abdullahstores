<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Products — Abdullah Store</title>
<meta name="theme-color" content="#16A34A">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body data-page="products">

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Abdullah<span>Store</span></a>
    <form class="search-form" data-search-form>
      <input type="search" placeholder="Search products..." aria-label="Search products" data-search-input>
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
      </button>
    </form>
    <nav class="desktop-nav desktop-only">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="categories.html">Categories</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 12h11L21 8H6"/></svg>
        <span class="cart-badge" data-cart-badge style="display:none">0</span>
      </a>
      <a href="account.html" class="icon-btn" aria-label="Account" id="accountBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7"/></svg>
      </a>
    </div>
  </div>
</header>

<main class="container" style="padding-top:20px;padding-bottom:40px">
  <h1 class="section-title" style="margin-bottom:16px">All Products</h1>

  <div class="filter-bar" id="categoryTabs"></div>

  <div class="filter-selects">
    <select id="sortSelect" aria-label="Sort products">
      <option value="newest">Newest</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
      <option value="bestselling">Best Selling</option>
    </select>
    <select id="stockSelect" aria-label="Stock filter">
      <option value="all">All Items</option>
      <option value="instock">In Stock Only</option>
    </select>
    <select id="priceSelect" aria-label="Price range">
      <option value="all">Any Price</option>
      <option value="0-25">Under $25</option>
      <option value="25-50">$25 – $50</option>
      <option value="50-100">$50 – $100</option>
      <option value="100-500">$100 – $500</option>
      <option value="500-999999">$500+</option>
    </select>
  </div>

  <div id="activeSearch" style="display:none;margin-bottom:16px;font-size:.9rem;color:var(--muted)"></div>

  <div class="product-grid" id="productsGrid">
    <div class="product-card"><div class="skeleton skeleton-img"></div><div style="padding:10px"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div></div>
    <div class="product-card"><div class="skeleton skeleton-img"></div><div style="padding:10px"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div></div>
    <div class="product-card"><div class="skeleton skeleton-img"></div><div style="padding:10px"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div></div>
    <div class="product-card"><div class="skeleton skeleton-img"></div><div style="padding:10px"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div></div>
    <div class="product-card"><div class="skeleton skeleton-img"></div><div style="padding:10px"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div></div>
    <div class="product-card"><div class="skeleton skeleton-img"></div><div style="padding:10px"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div></div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-grid">
      <div class="footer-col"><h4>Abdullah Store</h4><p>Premium products, delivered fast.</p></div>
      <div class="footer-col"><h4>Shop</h4><a href="products.html">All Products</a><a href="categories.html">Categories</a><a href="cart.html">Cart</a></div>
      <div class="footer-col"><h4>Account</h4><a href="login.html">Login</a><a href="register.html">Register</a><a href="my-orders.html">My Orders</a></div>
      <div class="footer-col"><h4>Info</h4><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div>
    </div>
    <div class="footer-bottom">© <span id="year"></span> Abdullah Store. All rights reserved.</div>
  </div>
</footer>

<nav class="mobile-nav">
  <a href="index.html" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
  <a href="products.html" data-nav="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Shop</span></a>
  <a href="cart.html" data-nav="cart" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 12h11L21 8H6"/></svg><span>Cart</span><span class="cart-badge" data-cart-badge style="display:none">0</span></a>
  <a href="account.html" data-nav="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7"/></svg><span>Account</span></a>
</nav>

<script>document.getElementById("year").textContent=new Date().getFullYear();</script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/products-page.js"></script>
</body>
</html>
