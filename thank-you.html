<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thank You — Abdullah Store</title>
<meta name="theme-color" content="#16A34A">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body data-page="thank-you">

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Abdullah<span>Store</span></a>
    <div class="header-actions" style="margin-left:auto">
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 12h11L21 8H6"/></svg>
        <span class="cart-badge" data-cart-badge style="display:none">0</span>
      </a>
      <a href="account.html" class="icon-btn" aria-label="Account" id="accountBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7"/></svg>
      </a>
    </div>
  </div>
</header>

<main class="container" style="padding:40px 16px;text-align:center;max-width:600px">
  <div class="scale-in" style="width:88px;height:88px;border-radius:50%;background:#D1FAE5;
    display:grid;place-items:center;margin:0 auto 24px;color:var(--green)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="width:44px;height:44px">
      <path d="M5 13l4 4L19 7"/>
    </svg>
  </div>
  <h1 style="font-size:1.8rem;font-weight:800;color:var(--black);margin-bottom:8px">Thank you!</h1>
  <p style="color:var(--muted);margin-bottom:24px">
    Your order has been received and is being processed.
  </p>

  <div id="orderInfo" style="background:var(--white);border-radius:12px;padding:20px;
    box-shadow:var(--shadow);text-align:left;margin-bottom:24px"></div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <a href="my-orders.html" class="btn btn-primary btn-block">View My Orders</a>
    <a href="products.html" class="btn btn-ghost btn-block">Continue Shopping</a>
  </div>
</main>

<script>document.getElementById("year")?.textContent=new Date().getFullYear();</script>
<script type="module" src="js/app.js"></script>
<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
  import { formatUSD, formatNGN, formatDate, escapeHtml } from "./utilities.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

  const params = new URLSearchParams(location.search);
  const orderId = params.get("orderId");
  const info = document.getElementById("orderInfo");

  if (!orderId) {
    info.innerHTML = `<p style="color:var(--muted)">No order ID provided.</p>`;
  } else {
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        info.innerHTML = `<p style="color:var(--muted)">Please <a href="login.html" style="color:var(--green)">sign in</a> to view your order.</p>`;
        return;
      }
      try {
        const snap = await getDoc(doc(db, "orders", orderId));
        if (!snap.exists()) {
          info.innerHTML = `<p style="color:var(--muted)">Order not found.</p>`;
          return;
        }
        const o = snap.data();
        if (o.userId !== user.uid) {
          info.innerHTML = `<p style="color:var(--muted)">You do not have access to this order.</p>`;
          return;
        }
        info.innerHTML = `
          <div style="display:flex;justify-content:space-between;margin-bottom:12px">
            <span style="color:var(--muted);font-size:.85rem">Order Number</span>
            <strong style="color:var(--black)">${escapeHtml(o.orderNumber || "")}</strong>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:12px">
            <span style="color:var(--muted);font-size:.85rem">Date</span>
            <span>${formatDate(o.createdAt)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:12px">
            <span style="color:var(--muted);font-size:.85rem">Status</span>
            <span class="order-status ${o.status}">${o.status}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border)">
            <strong>Total</strong>
            <span>
              <strong style="color:var(--green)">${formatUSD(o.total)}</strong>
              <small style="display:block;color:var(--green);text-align:right">≈ ${formatNGN(o.total)}</small>
            </span>
          </div>
          <a href="order-details.html?id=${orderId}" class="btn btn-ghost btn-block" style="margin-top:16px">View Full Details</a>
        `;
      } catch (err) {
        info.innerHTML = `<p style="color:#DC2626">${escapeHtml(err.message)}</p>`;
      }
    });
  }
</script>
</body>
</html>
